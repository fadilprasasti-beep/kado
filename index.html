<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Elvita Agustina</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1525; 
            color: #ebd5b3; 
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }
        h1, h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
        }
        .screen {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 25px;
            transition: opacity 0.8s ease-in-out;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }
        .active {
            display: flex;
            opacity: 1;
            z-index: 10;
        }
        
        .fade-up {
            animation: fadeUpAnim 1.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.8s; }
        .delay-3 { animation-delay: 1.3s; }

        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #d1bfae;
        }
        h1.title {
            font-size: 2.8rem;
            line-height: 1.3;
            margin-bottom: 20px;
            color: #fff;
        }
        h2.name {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #fff;
        }
        
        button {
            background: transparent;
            color: #ebd5b3;
            border: 1px solid #ebd5b3;
            padding: 12px 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            margin-top: 30px;
            position: relative;
            z-index: 999;
        }
        button:hover {
            background: #ebd5b3;
            color: #1a1525;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(235, 213, 179, 0.4);
        }

        .countdown-container {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(235, 213, 179, 0.2);
            border-radius: 10px;
            padding: 15px 10px;
            min-width: 70px;
            backdrop-filter: blur(5px);
        }
        .time-val {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 5px;
        }
        .time-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        .letter-box {
            max-width: 450px;
            background: rgba(255, 255, 255, 0.03);
            padding: 35px;
            border-radius: 15px;
            border: 1px solid rgba(235, 213, 179, 0.15);
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .letter-box p {
            font-size: 1rem;
            line-height: 1.9;
            font-style: italic;
            color: #f2e3c6;
        }

        /* PERUBAHAN GALERI & UKURAN FOTO ADA DI SINI */
        .polaroid-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px; /* Jarak antar foto diperlebar */
            max-width: 650px; /* Area galeri diperbesar */
            max-height: 55vh; /* Batas tinggi galeri agar tombol bawah tidak tertutup */
            overflow-y: auto; /* Memunculkan efek scroll jika foto banyak */
            padding: 15px 10px;
            margin-top: 15px;
        }
        /* Menyembunyikan bar scroll agar tetap estetik */
        .polaroid-gallery::-webkit-scrollbar { width: 0px; }

        .polaroid {
            background: #fff;
            padding: 12px 12px 35px 12px; /* Bingkai lebih tebal */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 3px;
            width: 170px; /* UKURAN DIPERBESAR (sebelumnya 140px) */
            transition: transform 0.4s ease;
        }
        .polaroid img {
            width: 100%;
            height: 160px; /* TINGGI FOTO DIPERBESAR */
            object-fit: cover;
            filter: grayscale(15%) sepia(20%);
        }
        .polaroid:nth-child(odd) { transform: rotate(-4deg); }
        .polaroid:nth-child(even) { transform: rotate(5deg); }
        .polaroid:hover {
            transform: scale(1.15) rotate(0deg);
            z-index: 2;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7);
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
            border: 1px solid rgba(235, 213, 179, 0.3);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        video {
            width: 100%;
            display: block;
        }

            position: absolute;
            background: #ebd5b3;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }
